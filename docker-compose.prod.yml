version: '3.9'

# ─── Production stack ─────────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env file: .env.production (see .env.production.example)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-smarketing}
      POSTGRES_USER:     ${POSTGRES_USER:-smarketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarketing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ───────────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY}/smarketing-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarketing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smarketing}
      NODE_ENV: production
      PORT: 8000
    volumes:
      # Persistent file storage (swap for S3 bucket in high-scale)
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_REGISTRY}/smarketing-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - internal
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Let's Encrypt cert renewal ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew certs every 12 hours; only updates when < 30 days left
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  uploads_data:
  exports_data:
  certbot_www:
  certbot_certs:
  nginx_logs:

networks:
  internal:
    driver: bridge
    internal: true      # DB + backend not reachable from internet
  public:
    driver: bridge
